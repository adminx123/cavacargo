    <script>
    // Password prompt for Freight Quote and Bin Rental links
    document.addEventListener('DOMContentLoaded', function() {
        const binRentalLink = document.getElementById('binRentalLink');
        const freightQuoteLink = document.getElementById('freightQuoteLink');

        function checkPassword(event, redirectUrl) {
            event.preventDefault(); // Prevent the default action
            const password = prompt('Please enter the password for access:');

            // Check if the password is correct
            if (password === 'facebook') { // Replace 'facebook' with the actual password
                window.location.href = redirectUrl; // Redirect to the appropriate page
            } else {
                alert('Incorrect password. Access denied.'); // Inform the user of the error
            }
        }

        // Add event listeners
        if (binRentalLink) {
            binRentalLink.addEventListener('click', function(event) {
                checkPassword(event, 'legal/box'); // Redirect to Bin Rental page
            });
        }

        if (freightQuoteLink) {
            freightQuoteLink.addEventListener('click', function(event) {
                checkPassword(event, 'pages/freight.html'); // Redirect to Freight Quote page
            });
        }
    });
    </script>
</body>
</html>


   



    <script>
        // Hamburger menu toggle
        const menuToggle = document.getElementById('menuToggle');
        const dropdownMenu = document.getElementById('dropdownMenu');

        menuToggle.addEventListener('click', () => {
            menuToggle.classList.toggle('active');
            dropdownMenu.style.display = dropdownMenu.style.display === 'block' ? 'none' : 'block';
        });

        document.addEventListener('click', (event) => {
            if (!menuToggle.contains(event.target) && !dropdownMenu.contains(event.target)) {
                dropdownMenu.style.display = 'none';
                menuToggle.classList.remove('active');
            }
        });

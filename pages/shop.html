<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Curated Store</title>
    <link rel="icon" type="image/x-icon" href="../assets/media/logo.png">
    <link rel="stylesheet" href="../assets/style/style.css">
    <script src="../assets/js/hamburger.js"></script>
</head>
<body>
    <div class="device-container">
        <!-- Navigation -->
        <nav class="nav-bar">
            <a href="/" class="nav-brand">
                <img src="../assets/media/logo.png" alt="Cava Cargo" style="height: 40px; width: auto;">
            </a>
        </nav>

        <!-- Shop Header -->
        <div class="shop-header">
            <h1>Our Curated Collection</h1>
        </div>

        <!-- Category Selection -->
        <div class="category-section" id="categorySection">
            <h2>Browse by Category</h2>
            <div class="category-grid">
                <div class="feature category-button" data-category="kitchen">
                    <span class="feature-icon">🍳</span>
                    <span>Kitchen</span>
                </div>
                <div class="feature category-button" data-category="sport">
                    <span class="feature-icon">⚽</span>
                    <span>Sport</span>
                </div>
                <div class="feature category-button" data-category="home">
                    <span class="feature-icon">🏠</span>
                    <span>Home</span>
                </div>
                <div class="feature category-button" data-category="electronics">
                    <span class="feature-icon">📱</span>
                    <span>Electronics</span>
                </div>
            </div>
        </div>

        <!-- Subcategory Selection (hidden initially) -->
        <div class="subcategory-section" id="subcategorySection" style="display: none;">
            <h2 id="subcategoryTitle">Select Subcategory</h2>
            <div class="category-grid" id="subcategoryGrid">
                <!-- Subcategories will be populated dynamically -->
            </div>
            <button class="back-button" onclick="showCategories()">← Back to Categories</button>
        </div>

        <!-- Products Grid -->
        <div class="products-grid" id="products">
            <!-- Products will be loaded dynamically -->
        </div>

        <!-- Loading indicator -->
        <div class="loading" id="loading" style="display: none;">
            <p>Loading amazing products...</p>
        </div>
    </div>

    <script>
        // Load products dynamically
        let isInitialLoad = true;

        async function loadProducts(showLoading = true) {
            try {
                if (showLoading) {
                    document.getElementById('loading').style.display = 'block';
                }

                const response = await fetch('/api/products');
                const products = await response.json();

                const container = document.getElementById('products');

                const cardsHtml = products.map((product) => {
                    const affiliateUrl = `https://www.temu.com/un/a-103-103?redirect_url=${encodeURIComponent(`https://www.temu.com/goods.html?_p_rid=123456789&_p_pid=${product.temuId}`)}`;
                    
                    return `
                        <div class="product-card">
                            <div class="product-image">
                                <a href="${affiliateUrl}" target="_blank" rel="noopener noreferrer">
                                    <img src="${product.images[0]}" alt="${product.name}" loading="lazy">
                                </a>
                            </div>
                            <div class="product-info">
                                <h3 class="product-title">
                                    <a href="${affiliateUrl}" target="_blank" rel="noopener noreferrer">${product.name}</a>
                                </h3>
                                <p class="product-description">${product.description.substring(0, 100)}...</p>
                                <div class="product-price">$${(product.sellingPrice / 100).toFixed(2)}</div>
                                <div class="product-actions">
                                    <button class="favorite-btn" onclick="toggleFavorite('${product.id}')">🤍</button>
                                    <a href="${affiliateUrl}" target="_blank" rel="noopener noreferrer" class="btn-view">
                                        View on Temu →
                                    </a>
                                </div>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = `<div class="products-container">${cardsHtml.join('')}</div>`;
                if (showLoading) {
                    document.getElementById('loading').style.display = 'none';
                }
                updateFavoriteButtons();

            } catch (error) {
                console.error('Error loading products:', error);
                if (!isInitialLoad) {
                    document.getElementById('loading').innerHTML = '<p>Error loading products. Please refresh.</p>';
                }
                isInitialLoad = false;
            }
        }

        // Favorites functionality
        function toggleFavorite(productId) {
            if (favorites.includes(productId)) {
                favorites = favorites.filter(id => id !== productId);
            } else {
                favorites.push(productId);
            }
            localStorage.setItem('favorites', JSON.stringify(favorites));
            updateFavoriteButtons();
        }

        function updateFavoriteButtons() {
            document.querySelectorAll('.favorite-btn').forEach(btn => {
                const productId = btn.getAttribute('onclick').match(/'([^']+)'/)[1];
                if (favorites.includes(productId)) {
                    btn.textContent = '💖';
                } else {
                    btn.textContent = '🤍';
                }
            });
        }

        // Category data
        const subcategories = {
            kitchen: ['Cookware', 'Appliances', 'Utensils'],
            sport: ['Fishing', 'Snowboarding', 'Hiking/Camping'],
            home: ['Decor', 'Furniture', 'Bedding'],
            electronics: ['Phones', 'Computers', 'Accessories']
        };

        // Load products on page load
        loadProducts(false);

        // Category selection
        document.addEventListener('DOMContentLoaded', () => {
            const categoryButtons = document.querySelectorAll('.category-button');
            categoryButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const category = button.dataset.category;
                    showSubcategories(category);
                });
            });
        });

        function showCategories() {
            document.getElementById('categorySection').style.display = 'block';
            document.getElementById('subcategorySection').style.display = 'none';
            document.getElementById('products').innerHTML = '';
        }

        function showSubcategories(category) {
            document.getElementById('categorySection').style.display = 'none';
            document.getElementById('subcategorySection').style.display = 'block';
            document.getElementById('subcategoryTitle').textContent = `Select ${category.charAt(0).toUpperCase() + category.slice(1)} Subcategory`;
            
            const grid = document.getElementById('subcategoryGrid');
            grid.innerHTML = subcategories[category].map(sub => `
                <div class="feature category-button" onclick="selectSubcategory('${category}', '${sub}')">
                    <span class="feature-icon">📦</span>
                    <span>${sub}</span>
                </div>
            `).join('');
        }

        function selectSubcategory(category, subcategory) {
            document.getElementById('subcategorySection').style.display = 'none';
            // For now, load all products (since no category data in products)
            loadProducts(true);
            // TODO: Filter products by category/subcategory
        }
    </script>
</body>
</html>
